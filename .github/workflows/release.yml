name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (Native Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v4.3.1

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
            echo "KEYSTORE_STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEYSTORE_KEY_ALIAS=${SECRET_KEY_ALIAS:-upload}" >> "$GITHUB_ENV"
            echo "KEYSTORE_KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            EPHEMERAL_PASS=$(openssl rand -hex 24)
            keytool -genkey -v -keystore app/upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$EPHEMERAL_PASS" -keypass "$EPHEMERAL_PASS" -dname "CN=Reward Automator, OU=App, O=Org, L=City, S=State, C=US"
            echo "::add-mask::$EPHEMERAL_PASS"
            echo "KEYSTORE_STORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "KEYSTORE_KEY_ALIAS=upload" >> "$GITHUB_ENV"
            echo "KEYSTORE_KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
          fi

      - name: Run Unit Tests & Build Release APKs
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Build Release App Bundle (AAB)
        run: ./gradlew bundleRelease

      - name: Prepare Release Binaries
        run: |
          cp app/build/outputs/apk/release/app-universal-release.apk app/build/outputs/apk/release/microsoft-rewards-automator-universal.apk
          ls -lh app/build/outputs/apk/release/
          ls -lh app/build/outputs/bundle/release/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microsoft-rewards-native-apks
          path: |
            app/build/outputs/apk/release/microsoft-rewards-automator-universal.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Create Release & Upload Binaries
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            app/build/outputs/apk/release/microsoft-rewards-automator-universal.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
