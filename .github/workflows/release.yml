name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'feat/native-android'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (Native Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v4.3.1
        with:
          gradle-version: '8.14.3'

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          else
            keytool -genkey -v -keystore android/app/upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass microsoft -keypass microsoft -dname "CN=Reward Automator, OU=App, O=Org, L=City, S=State, C=US"
          fi

      - name: Run Unit Tests
        working-directory: android
        run: gradle testReleaseUnitTest --no-daemon

      - name: Build Release App Bundle (AAB)
        working-directory: android
        run: gradle bundleRelease --no-daemon

      - name: Build Universal & Split-per-ABI Release APKs
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare Release Binaries
        run: |
          cp android/app/build/outputs/apk/release/app-universal-release.apk android/app/build/outputs/apk/release/microsoft-rewards-automator-universal.apk
          ls -lh android/app/build/outputs/apk/release/
          ls -lh android/app/build/outputs/bundle/release/

      - name: Create Release & Upload Binaries
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            android/app/build/outputs/apk/release/microsoft-rewards-automator-universal.apk
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            android/app/build/outputs/apk/release/app-x86_64-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
