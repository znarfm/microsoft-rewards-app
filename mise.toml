[tools]
java = "17"
gradle = "8.14.3"

[tasks.test]
description = "Run unit tests"
dir = "android"
run = "gradle testReleaseUnitTest"

[tasks.build]
description = "Build release APKs"
dir = "android"
run = "gradle assembleRelease"

[tasks.bundle]
description = "Build release bundle (AAB)"
dir = "android"
run = "gradle bundleRelease"
