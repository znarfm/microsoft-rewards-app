[tools]
java = "17"
gradle = "9.3.1"

[tasks.test]
description = "Run unit tests"
dir = "android"
run = "gradle testDebugUnitTest"

[tasks.build]
description = "Build release APKs"
dir = "android"
run = "gradle assembleRelease"

[tasks.bundle]
description = "Build release bundle (AAB)"
dir = "android"
run = "gradle bundleRelease"
