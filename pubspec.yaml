name: microsoft_automatic_rewards
version: 1.3.0+15

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  get_it: ^9.2.1
  equatable: ^2.0.5
  word_generator: ^0.6.0
  shared_preferences: ^2.5.3
  flutter_launcher_icons: ^0.14.3
  flutter_inappwebview: ^6.1.5
  bloc: ^9.2.1
  animated_text_kit: ^4.2.3
  flutter_local_notifications: ^22.2.0
  flutter_timezone: ^5.1.0
  wakelock_plus: ^1.3.2
  dynamic_color: ^1.9.0
  timezone: ^0.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/auto_search.png"
  remove_alpha_ios: true
